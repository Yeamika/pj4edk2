<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PJ4EDK2 UI viewer</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow:auto;background:#c3dff0;font-family:Inter,sans-serif}#surface{position:relative;transform-origin:top left;overflow:hidden;touch-action:none}#metrics{position:sticky;bottom:4px;left:8px;z-index:10000;font:11px monospace;color:#214d69;background:#edf6fbe8;padding:4px 8px;border-radius:4px;pointer-events:none}</style>
<style>#preview{touch-action:none;overscroll-behavior:contain;position:relative;width:100%;overflow:hidden;background:#152c3a}#controls{padding:20px;max-width:1200px;margin:auto;color:#214d69}fieldset{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;border:1px solid #a6c9dd;border-radius:8px}label{display:flex;gap:6px;align-items:center}input,select,button{font:inherit;padding:6px;border:1px solid #a6c9dd;border-radius:5px}input[type=number]{width:95px}textarea{width:100%;height:170px;font:13px monospace}pre{max-height:200px;overflow:auto}#error{color:#a22}</style>
<style>
:root{--toolbar-height:58px}#toolbar{position:sticky;top:0;z-index:20000;height:var(--toolbar-height);display:flex;align-items:center;gap:10px;padding:8px 18px;background:#214d69;color:#fff;box-shadow:0 1px 6px #0003}
#toolbar>*{flex-shrink:0}
#toolbar strong{font-size:21px;letter-spacing:.8px;margin-right:auto}#toolbar label{gap:6px;white-space:nowrap}#toolbar input{width:82px;background:#f7fcff;color:#214d69}#toolbar button{background:#edf6fb;color:#214d69;cursor:pointer}#toggle-settings{font-size:24px;line-height:24px;width:42px}
#device-keys{display:flex;gap:6px}#device-keys button{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;min-height:40px;white-space:nowrap;touch-action:manipulation}#device-keys svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#device-keys button:disabled{opacity:.45;cursor:default}#device-keys button:active:not(:disabled){background:#b9d9ec}
#controls{position:fixed;top:var(--toolbar-height);right:0;bottom:0;width:min(560px,100%);padding:20px;margin:0;overflow:auto;background:#edf6fb;z-index:19000;box-shadow:-5px 0 25px #0003}#controls h2{margin-top:0}#controls fieldset{padding:12px}#controls label{flex-wrap:wrap}#controls input[type=file]{max-width:100%;width:100%}#controls textarea{height:210px}#controls #tree{background:#d6e9f4;padding:10px;border-radius:6px}#controls[hidden]{display:none}#settings-shade{position:fixed;inset:var(--toolbar-height) 0 0;background:#10253644;z-index:18000}#settings-shade[hidden]{display:none}#metrics{position:fixed;bottom:4px;left:auto;right:8px;z-index:17000}
@media(max-width:850px){#toolbar{padding:6px 8px;gap:6px;overflow-x:auto;scrollbar-width:thin}#toolbar strong{font-size:16px}#toolbar input{width:61px;font-size:13px}#toolbar .resolution-label{display:none}#toolbar button{font-size:14px;padding:6px}}
</style>
<header id="toolbar"><strong>PJ4EDK2</strong><div id="device-keys" role="group" aria-label="模拟实体按键"><button id="power-key" title="电源键：确认（Enter）" aria-label="电源键：确认"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5-7a9 9 0 1 0 10 0"/></svg></button><button id="volume-up" title="音量加：向上选择（↑）" aria-label="音量加键：向上选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg><span>音量 +</span></button><button id="volume-down" title="音量减：向下选择（↓）" aria-label="音量减键：向下选择"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m-7-7 7 7 7-7"/></svg><span>音量 −</span></button></div><label><span class="resolution-label">分辨率</span><input aria-label="预览宽度" id="width" type="number" min="320" max="3840" value="1920">×<input aria-label="预览高度" id="height" type="number" min="320" max="3840" value="1200"></label><button id="apply" title="应用分辨率与设置，重新启动预览">重启</button><button id="toggle-settings" aria-label="完整设置" aria-expanded="false" aria-controls="controls">☰</button></header>
<div id="settings-shade" hidden></div><div id="preview"><div id="surface"></div></div>
<section id="controls" hidden><h2>完整设置</h2><fieldset><legend>UI 资源包</legend><label>加载 .pocket <input id="ui-package" type="file" accept=".pocket"></label></fieldset>
<fieldset><legend>运行与显示</legend><label>运行方式 <select id="backend"><option value="wasm">PocketJS（WASM）</option><option value="direct">直接运行（浏览器 DOM）</option></select></label><label>场景 <select id="mode"><option>uefi</option><option>charging</option><option>low-battery</option><option>recovery</option></select></label><button id="apply-settings">应用设置并重启</button><button id="power-on">开机 / 重启</button><button id="power-off">模拟关机</button></fieldset>
<fieldset><legend>电量与供电（模拟）</legend><label>电量 % <input id="battery" type="number" min="0" max="100" value="76"></label><label>外接电源 <input id="external" type="checkbox" checked></label><label>状态 <select id="charging"><option value="charge">充电</option><option value="discharge">放电</option><option value="idle">未充电</option><option value="unknown">未知</option></select></label><label>电压 mV <input id="voltage" type="number" min="1" max="100000" value="4100"></label><label>电流 mA <input id="current" type="number" min="-100000" max="100000" value="800"></label></fieldset>
<fieldset><legend>虚拟硬盘 / ESP 文件树</legend><label>导入文件夹 <input id="folder" type="file" webkitdirectory multiple></label><button id="load-disk">从虚拟盘读取配置</button><button id="scan-disk">扫描 EFI 启动项</button><button id="save-disk">保存配置到虚拟盘</button><button id="export-disk">导出虚拟盘 JSON</button><label>导入虚拟盘 JSON <input id="import-disk" type="file" accept="application/json"></label></fieldset>
<pre id="tree"></pre><label>启动列表（JSON）</label><textarea id="entries" spellcheck="false"></textarea><p id="error"></p><p>仅演示 UI；不会启动 EFI 或操作真实分区。虚拟盘保留在当前页面内存中，可导出保存。</p></section><output id="metrics">Loading UI…</output><script>addEventListener('error',e=>{document.querySelector('#metrics').textContent='Error: '+e.message});addEventListener('unhandledrejection',e=>{document.querySelector('#metrics').textContent='Error: '+e.reason});</script><script type="module" src="viewer/viewer.js?v=pixel-1"></script></html>
