language = "C"
include_guard = "POCKETJS_BOOT_CONTEXT_H"
autogen_warning = "/* Generated from Rust by tools/generate_header.rs + cbindgen 0.29.2. Do not edit. */"
cpp_compat = true
style = "type"
usize_is_size_t = false
no_includes = true
after_includes = """
#ifdef PJB_EDK2
#include <Base.h>
typedef UINT8 uint8_t;
typedef UINT16 uint16_t;
typedef UINT32 uint32_t;
typedef UINT64 uint64_t;
typedef INT32 int32_t;
typedef UINTN uintptr_t;
#ifndef offsetof
#define offsetof(type, field) OFFSET_OF(type, field)
#endif
#else
#include <stdint.h>
#include <stddef.h>
#endif
#if defined(__x86_64__) || defined(_M_X64)
#define PJB_TARGET_X64
#if defined(_MSC_VER)
#define PJB_EFIAPI
#else
#define PJB_EFIAPI __attribute__((ms_abi))
#endif
#elif defined(__aarch64__) || defined(_M_ARM64)
#define PJB_TARGET_AARCH64
#define PJB_EFIAPI
#else
#error "Only UEFI X64 and AArch64 are supported"
#endif
"""

[export]
include = ["Guid", "Invoke", "PlatformProtocol", "PowerSample", "ChargeControlProtocol", "BootDisplay"]

[defines]
'target_arch = x86_64' = "PJB_TARGET_X64"
'target_arch = aarch64' = "PJB_TARGET_AARCH64"

[export.rename]
"BootDisplay" = "PJB_BOOT_DISPLAY"
"BOOT_DISPLAY_REVISION" = "PJB_BOOT_DISPLAY_REVISION"
